[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmri-fus-bits"
version = "0.1.0"
description = "Information rates of hemodynamic signals (fMRI, functional ultrasound) under task and acquisition design"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "scipy>=1.12", "remotezip>=0.12.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "ipykernel>=6", "mypy>=1.15", "import-linter>=2.0", "scipy-stubs>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/fmri_fus_bits"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

# remotezip ships without type information.
[[tool.mypy.overrides]]
module = ["remotezip"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "fmri_fus_bits"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Source configuration never touches the network"
type = "forbidden"
source_modules = ["fmri_fus_bits.sources"]
forbidden_modules = ["remotezip", "requests"]
