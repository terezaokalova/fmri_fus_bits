[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmri-fus-bits"
version = "0.1.0"
description = "Information rates of hemodynamic signals (fMRI, functional ultrasound) under task and acquisition design"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "scipy>=1.12", "remotezip>=0.12.6", "h5py>=3.10", "boto3>=1.34", "nibabel>=5.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "ipykernel>=6", "mypy>=1.15", "import-linter>=2.0", "scipy-stubs>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/fmri_fus_bits"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

# These libraries ship without type information.
[[tool.mypy.overrides]]
module = ["remotezip", "h5py", "boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# nibabel's type hints are partial (e.g. CIFTI axes); treat it as untyped.
[[tool.mypy.overrides]]
module = ["nibabel", "nibabel.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.importlinter]
root_package = "fmri_fus_bits"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Source configuration never touches the network"
type = "forbidden"
source_modules = ["fmri_fus_bits.sources"]
forbidden_modules = ["remotezip", "requests", "boto3"]

[[tool.importlinter.contracts]]
name = "Estimators work on arrays and never touch data access"
type = "forbidden"
source_modules = ["fmri_fus_bits.information", "fmri_fus_bits.noise", "fmri_fus_bits.channel", "fmri_fus_bits.kernels", "fmri_fus_bits.equalizers"]
forbidden_modules = ["fmri_fus_bits.datasets", "remotezip", "requests", "boto3", "h5py", "nibabel"]
